name: Codex upstream watch

# The native Codex package tracks one official release. This job notices the
# next one, checks whether the source patches still apply to it, and keeps one
# issue per upstream version with the result, so a rebase starts the day the
# release appears instead of the day a user loses the guard to `codex update`.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned Codex with upstream's latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(python3 -c 'import json; print(json.load(open("codex/model-guard/native/release.json"))["codex_version"])')
          latest=$(gh release list -R openai/codex --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^rust-v//')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned $pinned, upstream latest $latest"
      - name: Try the patches on the new release
        if: steps.compare.outputs.latest != steps.compare.outputs.pinned
        id: apply
        run: |
          set +e
          git init --quiet upstream
          git -C upstream fetch --quiet --depth=1 https://github.com/openai/codex.git "rust-v${{ steps.compare.outputs.latest }}"
          git -C upstream checkout --quiet --detach FETCH_HEAD
          {
            echo "| Patch | Result on rust-v${{ steps.compare.outputs.latest }} |"
            echo "|---|---|"
            for patch in codex/model-guard/native/000[1236]-*.patch; do
              if out=$(git -C upstream apply --3way --check --whitespace=nowarn "$PWD/$patch" 2>&1); then
                echo "| \`$(basename "$patch")\` | applies cleanly |"
              else
                echo "| \`$(basename "$patch")\` | conflicts: $(echo "$out" | grep -oE 'codex-rs/[^:]+' | sort -u | tr '\n' ' ') |"
              fi
            done
            echo
            echo "Schemas (0004) and the lockfile (0005) are regenerated for every release, so they are not checked."
          } > result.md
          cat result.md
      - name: Keep one issue per upstream release
        if: steps.compare.outputs.latest != steps.compare.outputs.pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Codex ${{ steps.compare.outputs.latest }} is out; the native package is on ${{ steps.compare.outputs.pinned }}"
          {
            echo "Upstream published \`rust-v${{ steps.compare.outputs.latest }}\` and \`native/release.json\` still pins ${{ steps.compare.outputs.pinned }}."
            echo
            cat result.md
            echo
            echo "Runbook: rebase whatever conflicts, update the pins in \`release.json\` (tag, commit, patch and helper digests), dispatch **Codex native package** to build, attach its archive to release \`v<plugin version>\`, fill the archive digests into \`release.json\`, bump the four Codex version fields, release. Installed machines then move with \`model-guard-codex update\`."
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label codex-upstream || gh issue create --title "$title" --body-file body.md
          fi
