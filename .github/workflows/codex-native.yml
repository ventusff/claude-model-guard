name: Codex native package

# Builds the pinned native Codex package the same way a maintainer does
# locally: inside rust:1.95.0-bookworm, from the tag and patches in
# native/release.json, with the helpers of the official standalone package of
# that tag. The archive and its digests come back as a workflow artifact; a
# release attaches the archive and records the digests in release.json.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: rust:1.95.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libssl-dev libcap-dev python3 curl >/dev/null
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq && apt-get install -y -qq gh >/dev/null
      - name: Fetch the official standalone package of the pinned tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rust-v$(python3 -c 'import json; print(json.load(open("codex/model-guard/native/release.json"))["codex_version"])')"
          mkdir -p /tmp/official
          gh release download "$tag" -R openai/codex -p codex-package-x86_64-unknown-linux-musl.tar.gz -D /tmp/official
          tar -xzf /tmp/official/codex-package-x86_64-unknown-linux-musl.tar.gz -C /tmp/official
      - name: Build
        run: python3 codex/model-guard/native/build.py --work-dir /tmp/build --official-package /tmp/official --jobs "$(nproc)"
      - name: Record digests
        run: |
          cat /tmp/build/build-record.json
          mkdir -p /tmp/out
          cp /tmp/build/model-guard-codex-linux-x86_64.tar.gz /tmp/build/build-record.json /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: model-guard-codex-linux-x86_64
          path: /tmp/out
          if-no-files-found: error
