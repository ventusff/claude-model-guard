[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-guard"
version = "1.5.1"
description = "A persistent Codex CLI band for server-reported model routing and account identity"
requires-python = ">=3.11"
dependencies = ["websockets==17.1"]
license = "MIT"

[project.scripts]
model-guard-codex = "model_guard.cli:main"

[tool.setuptools.packages.find]
include = ["model_guard*"]
